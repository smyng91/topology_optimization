[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "topoopt"
version = "0.2.0"
description = "JAX topology optimization of a 2-D heated box"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.30,<0.13",
    "jaxlib>=0.4.30,<0.13",
    "numpy>=1.26,<3",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
cpu = ["jax[cpu]"]
dev = ["pytest>=8"]

[project.scripts]
topoopt-2d = "topoopt.run2d:main"

[tool.setuptools.packages.find]
include = ["topoopt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
