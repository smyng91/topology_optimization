name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: pip install -e ".[cpu,dev]"
      - name: Test
        env:
          MPLBACKEND: Agg
        # CPU pytest only. The 80×80 gallery is not run here.
        run: python -m pytest tests -q
